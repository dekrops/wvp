name: Veil experiment

# An isolated experiment (conformance/experiments/veil-registry). It builds Veil, which has its
# own Lean toolchain and an SMT solver and takes many minutes, so it runs only by hand or when the
# experiment changes. Nothing else depends on it, and it is not a required check.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - conformance/experiments/veil-registry/**
      - .github/workflows/veil-experiment.yml

permissions:
  contents: read

concurrency:
  group: veil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: The registry models hold, and the replicated one is violated as expected
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        env:
          ELAN_VERSION: v4.1.2
          ELAN_SHA256: f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/elan.tar.gz"
          echo "${ELAN_SHA256}  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/elan"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan"
          "$RUNNER_TEMP/elan/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bash conformance/experiments/veil-registry/run.sh "$RUNNER_TEMP/veil"
